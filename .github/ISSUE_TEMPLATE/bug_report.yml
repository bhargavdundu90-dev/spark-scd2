name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Your SCD2Config and a few snapshot rows built with spark.createDataFrame.
      render: python
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: spark-scd2, PySpark, Python and Java versions, and where Spark runs (local, Glue, EMR, Databricks ...)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
