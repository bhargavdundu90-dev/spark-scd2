name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff==0.17.*"
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # oldest supported Python with the oldest supported Spark
          - python: "3.9"
            pyspark: "pyspark==3.3.*"
            iceberg: ""
          # current Spark 3.5, also running the Iceberg MERGE integration tests
          - python: "3.11"
            pyspark: "pyspark==3.5.*"
            iceberg: "org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.6.1"
    name: test (python ${{ matrix.python }}, ${{ matrix.pyspark }})
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      SPARK_SCD2_ICEBERG_PACKAGES: ${{ matrix.iceberg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.pyspark }}" -e ".[dev]"
      - name: Test
        run: pytest -v
